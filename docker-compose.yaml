version: "3.8"
services:
  db:
    image: mysql
    ports:
      - 3306:3306
    volumes:
      - mysql:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: admin12345
      MYSQL_DATABASE: flash-dash
      MYSQL_USER: root
      MYSQL_PASSWORD: admin12345

  backend:
    build: .
    ports:
      - 8080:8080
    environment:
      - JWT_KEY=sQF1C+qQJpmV9A/M8/LPd5esayq2dpG/cD0MCEwJZjM
      - DB_HOST=jdbc:mysql://db:3306/flash-dash?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&useLegacyDatetimeCode=false
      - DB_USERNAME=root
      - DB_PASSWORD=admin12345    
    depends_on:
      - db

volumes:
  mysql:
