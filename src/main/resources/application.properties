############ Database Properties #############
spring.datasource.url=${{ secrets.DatabaseUrl }}
spring.datasource.username=${{ secrets.DatabaseUsername }}
spring.datasource.password=${{ secrets.DatabasePassword }}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.datasource.initialize=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
############# JWT #############
token.signing.key=${{ secrets.JwtKey }}