components:
  schemas:
    SignUpRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: The email address of the user attempting to sign up. Must be a valid email format.
        password:
          type: string
          format: password
          description: The password chosen by the user for account creation. Should meet the application's password strength requirements.

    SignInRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: The user's email address used for signing in.
        password:
          type: string
          format: password
          description: The user's password for account access. This should be the same password used at sign-up.

    JwtAuthenticationResponse:
      type: object
      properties:
        token:
          type: string
          description: The JSON Web Token (JWT) generated upon successful authentication. This token should be used for authorization in subsequent requests by including it in the request headers.

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
          description: The HTTP status code of the response, indicating the nature of the error.
        error:
          type: string
          description: A brief title or description of the error that occurred.
        path:
          type: string
          description: The request path where the error was encountered.
        timestamp:
          type: string
          format: date-time
          description: The timestamp when the error occurred, in ISO 8601 format.
        cause:
          type: string
          description: A more detailed explanation of why the error occurred.
        action:
          type: string
          description: Suggested action(s) to resolve the error or to avoid it in future requests.

    CardRequest:
      type: object
      required:
        - question
        - answer
      properties:
        question:
          type: string
          description: The question for the flashcard.
        answer:
          type: string
          description: The answer to the flashcard's question.
        difficulty:
          type: string
          description: The difficulty level of the flashcard (e.g., easy, medium, hard).

    CardResponse:
      type: object
      required:
        - cardId
        - question
        - answer
      properties:
        cardId:
          type: string
          description: The unique identifier of the flashcard.
        question:
          type: string
          description: The question of the flashcard.
        answer:
          type: string
          description: The answer to the flashcard's question.
        difficulty:
          type: string
          description: The difficulty level of the flashcard.
        createdAt:
          type: string
          format: date-time
          description: The timestamp when the flashcard was created.
        updatedAt:
          type: string
          format: date-time
          description: The timestamp when the flashcard was last updated.

    DeckRequest:
      type: object
      required:
        - name
        - deckType
      properties:
        name:
          type: string
          description: The name of the deck being created.
        description:
          type: string
          description: An optional description of the deck.
        deckType:
          type: string
          enum: [ CARD, QUESTION ]
          description: The type of the deck, either "CARD" or "QUESTION".

    DeckResponse:
      type: object
      required:
        - deckId
        - name
        - deckType
      properties:
        deckId:
          type: string
          description: The unique identifier of the deck.
        name:
          type: string
          description: The name of the deck.
        description:
          type: string
          description: The description of the deck, if provided.
        deckType:
          type: string
          enum: [ CARD, QUESTION ]
          description: The type of the deck, either "CARD" or "QUESTION".
        createdAt:
          type: string
          format: date-time
          description: The timestamp when the deck was created.
        updatedAt:
          type: string
          format: date-time
          description: The timestamp when the deck was last updated.

    QuestionRequest:
      type: object
      required:
        - question
        - correctAnswers
        - incorrectAnswers
      properties:
        question:
          type: string
          description: The question text.
        correctAnswers:
          type: array
          items:
            type: string
          description: A list of correct answers for the question.
        incorrectAnswers:
          type: array
          items:
            type: string
          description: A list of incorrect answers for the question.
        difficulty:
          type: string
          description: The difficulty level of the question (e.g., easy, medium, hard).

    QuestionResponse:
      type: object
      required:
        - questionId
        - question
        - correctAnswers
        - incorrectAnswers
      properties:
        questionId:
          type: string
          description: The unique identifier of the question.
        question:
          type: string
          description: The text of the question.
        correctAnswers:
          type: array
          items:
            type: string
          description: A list of correct answers for the question.
        incorrectAnswers:
          type: array
          items:
            type: string
          description: A list of incorrect answers for the question.
        difficulty:
          type: string
          description: The difficulty level of the question.
        createdAt:
          type: string
          format: date-time
          description: The timestamp when the question was created.
        updatedAt:
          type: string
          format: date-time
          description: The timestamp when the question was last updated.
