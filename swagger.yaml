          name: deckId
          required: true
          schema:
            type: string
          description: The unique identifier of the deck to which the flashcard is being added.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardRequest'
            example:
              question: What is the largest amphibian?
              answer: The Chinese giant salamander
              difficulty: hard
      responses:
