  /decks/{deckId}/cards:
    post:
      tags:
        - Cards
      summary: Add a new flashcard to a deck
      description: This endpoint allows authenticated users to add a new flashcard to an existing deck. It requires a JSON body with the flashcard's question, answer.
      parameters:
